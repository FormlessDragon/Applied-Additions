repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    flatDir {
        dirs("lib")
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven {
        name = 'CleanroomCurseMaven'
        url = 'https://curse.cleanroommc.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = "GeckoLib"
        url = uri("https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/")
    }
    maven {
        name = "ModMaven"
        url  = uri("https://modmaven.dev/")
    }
    maven {
        name = "Jitpack"
        url = uri("https://jitpack.io")
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // Cleanroom ships this; the recipe factories need JsonObject.deepCopy(), which Minecraft's own Gson 2.2.4 hides.
    compileOnly "com.google.code.gson:gson:2.12.1"
    // Included by the Minecraft 1.12 runtime; used for in-process Windows shell notifications.
    compileOnly "net.java.dev.jna:jna:4.4.0"
    if (enable_lwjglx.toBoolean()) {
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }

    modImplementation "com.github.FormlessDragon:Applied-Energistics-2-Supergiant:v1.0.14"
    modImplementation "curse.maven:had-enough-items-557549:7938914"
    modCompileOnly 'curse.maven:mouse-tweaks-unofficial-461660:5876158'
    compileOnly 'CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.711'
    //modImplementation 'software.bernie.geckolib:geckolib-forge-1.12.2:3.0.31'

}
